name: personal

# Compose runs what the app needs behind it: the API, its workers and the
# database. The Nuxt frontend is not here on purpose — it runs from the source
# tree with `npm run dev`, so a change to a component is on screen immediately
# instead of waiting on an image rebuild.

# The API, the queue worker and the scheduler are the same image with different
# commands, so they share one definition.
x-backend: &backend
  build:
    context: ./backend
    target: app
  env_file: ./backend/.env
  environment: &backend-env
    DB_CONNECTION: pgsql
    DB_HOST: personal-postgres-1
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-personal}
    DB_USERNAME: ${DB_USERNAME:-personal}
    DB_PASSWORD: ${DB_PASSWORD:-personal}
    QUEUE_CONNECTION: database
    DB_QUEUE_RETRY_AFTER: 210
    CACHE_STORE: database
    SESSION_DRIVER: database
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - instagram-media-cache:/var/www/html/storage/app/private/instagram-media
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-personal}
      POSTGRES_USER: ${DB_USERNAME:-personal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-personal}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Bound to the loopback interface so a desktop client (TablePlus, DBeaver,
    # psql) can reach it without the database being reachable off this machine.
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-personal} -d ${DB_DATABASE:-personal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - postgres
    restart: unless-stopped

  # Owns the schema: the only service that runs migrations.
  app:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"

  web:
    build:
      context: ./backend
      target: web
    ports:
      - "${API_PORT:-8000}:80"
    depends_on:
      - app
    networks:
      default:
        aliases:
          - web
    restart: unless-stopped

  # Runs imports and discovery work, and acts as a fallback for remix jobs if the
  # dedicated worker is unavailable.
  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--queue=remix,interactive,default", "--tries=3", "--timeout=150", "--sleep=1", "--max-time=3600"]
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started

  # The first Creator DNA never waits behind video or visual analysis.
  onboarding-queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--queue=onboarding", "--tries=3", "--timeout=180", "--sleep=1", "--max-time=3600"]
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started

  # Reels and carousels are batched, and two workers consume the batch in
  # parallel. Scale this service further without changing application code.
  analysis-queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--queue=analysis", "--tries=3", "--timeout=180", "--sleep=1", "--max-time=3600"]
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started

  # A remix never waits behind post analysis or long Instagram jobs.
  interactive-queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--queue=remix", "--tries=3", "--timeout=150", "--sleep=1", "--max-time=3600"]
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started

  # Daily Instagram refresh and OAuth state cleanup.
  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started

  # Local database browser. Behind the "tools" profile, so it never starts with a
  # plain `docker compose up` — it has no authentication of its own.
  adminer:
    image: adminer:5
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  instagram-media-cache:
