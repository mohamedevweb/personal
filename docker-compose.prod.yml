# Production override. Caddy owns the public HTTP ports. The Nuxt frontend is
# deployed separately, so only the API stack is part of this composition.
services:
  web:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

# The VPS has working IPv6, and Instagram serves this avatar CDN hostname over
# IPv6 only. Keep IPv6 enabled only for the production network so local Docker
# remains compatible with hosts that do not provide IPv6.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 2a01:4f8:1c18:f681:1000::/80

volumes:
  caddy-data:
  caddy-config:
