# Production override. Caddy owns the public HTTP ports. The Nuxt frontend is
# deployed separately, so only the API stack is part of this composition.
services:
  web:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
